services:
  xiaomusic:
    # 自建镜像：官方镜像 + aurora 主题 + 刮削脚本（见 build/Dockerfile）
    # 升级官方镜像时：改 build/Dockerfile 的 FROM → 重新 build → 改这里的 tag
    image: zhangsan51455/xiaomusic-aurora:1.5
    container_name: xiaomusic
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "58090:8090"   # 面板
    environment:
      XIAOMUSIC_PUBLIC_PORT: 58090
    volumes:
      - /volume3/music:/app/music
      - /volume1/docker/xiaomusic/config:/app/conf
