<!DOCTYPE html>
<html lang="zh-CN" data-theme="aurora">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>XiaoMusic</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
</head>

<body>
  <!-- 图标库：内联 sprite，不依赖任何 CDN -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
    <symbol id="i-seq" viewBox="0 0 24 24"><path d="M4 6h11v2H4zm0 5h11v2H4zm0 5h7v2H4zm12.5-2.5L21 17l-4.5 3.5v-7z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.9 2 2 2h16c1.11 0 2-.9 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-2v-2h-2v2H4V8h16v4z"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></symbol>
  </svg>

  <div class="app">
    <!-- ============ 左栏 ============ -->
    <aside class="rail" id="rail">
      <div class="brand"><span class="logo">♪</span>XiaoMusic</div>

      <div class="rail-sec">设备</div>
      <div class="rail-list" id="deviceList"></div>

      <div class="rail-sec">歌单</div>
      <div class="rail-list" id="sysList"></div>
      <div class="divider"></div>
      <div class="rail-list" id="cusList"></div>

      <div class="rail-foot">
        <a class="rail-item" href="/static/tailwind/setting.html" target="_blank">
          <svg class="ic"><use href="#i-settings"/></svg><span>设置</span>
        </a>
        <a class="rail-item" href="/static/tailwind/downloadtool.html" target="_blank">
          <svg class="ic"><use href="#i-download"/></svg><span>下载</span>
        </a>
      </div>
    </aside>

    <!-- ============ 主区 ============ -->
    <main class="main">
      <!-- 移动端头部 -->
      <div class="mhead">
        <div class="mh-row">
          <div class="mh-l">
            <h1 id="mTitle">所有歌曲</h1>
            <span class="mh-cnt" id="mCount"></span>
          </div>
          <button class="mh-dev" id="devBtn">
            <span class="dot"></span><span id="devName">Web 播放器</span>
            <svg class="ic"><use href="#i-chev"/></svg>
          </button>
        </div>
        <div class="chips" id="chips"></div>
        <label class="msearch">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="mQ" type="search" placeholder="搜索歌曲、歌手或专辑" autocomplete="off">
        </label>
      </div>

      <!-- 桌面端工具栏 -->
      <div class="topbar">
        <div class="top-l">
          <h1 id="dTitle">所有歌曲</h1>
          <span class="sub" id="dMeta"></span>
        </div>
        <label class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="dQ" type="search" placeholder="搜索歌曲、歌手或专辑" autocomplete="off">
        </label>
        <div class="tools">
          <button class="tool" id="btnRefresh" title="重新扫描曲库">
            <svg class="ic"><use href="#i-refresh"/></svg>
          </button>
          <button class="tool" id="btnNewList" title="新建歌单">
            <svg class="ic"><use href="#i-add"/></svg>
          </button>
          <a class="tool" href="/static/tailwind/setting.html" target="_blank" title="设置">
            <svg class="ic"><use href="#i-settings"/></svg>
          </a>
        </div>
      </div>

      <div class="card">
        <div class="grid head">
          <div class="c-num">#</div>
          <button class="c-ttl th" data-sort="title">标题<i class="caret"></i></button>
          <button class="c-art th" data-sort="artist">歌手<i class="caret"></i></button>
          <button class="c-alb th" data-sort="album">专辑<i class="caret"></i></button>
          <button class="c-dur th" data-sort="duration">时长<i class="caret"></i></button>
          <div class="c-more"></div>
        </div>
        <div class="rows" id="rows"></div>
        <div class="empty" id="empty" hidden></div>
        <div class="loadbar" id="loadbar" hidden><i></i><span></span></div>
      </div>
    </main>

    <!-- ============ 右栏：队列 / 歌词 ============ -->
    <aside class="player" id="player">
      <div class="p-q">
        <div class="qh">
          <div class="seg" id="paneSeg">
            <button type="button" class="on" data-pane="queue">队列</button>
            <button type="button" data-pane="lyric">歌词</button>
          </div>
          <span id="qCount"></span>
          <button class="p-open" id="panelStage" title="打开播放页">
            <svg class="ic up"><use href="#i-chev"/></svg>
          </button>
        </div>
        <div id="queue" class="queue"></div>
        <div id="lyric" class="lyric" hidden></div>
      </div>
    </aside>
  </div>

  <!-- 底部播放条 -->
  <div class="bar" id="mini">
    <div class="track bar-track" id="track"><i id="mProg"></i><b></b></div>
    <div class="bar-row">
      <button class="bar-song" id="barOpen" title="打开播放页">
        <span class="mini-art" id="mArt"></span>
        <span class="mini-txt">
          <span class="mini-t" id="mTitle2">未在播放</span>
          <span class="mini-a" id="mMeta2">—</span>
        </span>
      </button>
      <div class="bar-mid">
        <button class="ghost sm" id="btnMode" title="顺序播放"><svg class="ic"><use href="#i-seq"/></svg></button>
        <button class="ghost sm" id="btnPrev" title="上一首"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="play bar-play" id="btnPlay" title="播放/暂停"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="ghost sm" id="btnNext" title="下一首"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="ghost sm" id="btnFav" title="收藏"><svg class="ic"><use href="#i-heart"/></svg></button>
      </div>
      <div class="bar-right">
        <span class="bar-time"><b id="tCur">0:00</b><i>/</i><span id="tDur">0:00</span></span>
        <div class="bar-vol">
          <button class="ghost sm" id="mVol" title="音量"><svg class="ic"><use href="#i-vol"/></svg></button>
          <input type="range" id="vol" min="0" max="100" step="1" value="50" aria-label="音量">
          <span class="volnum" id="volNum">50</span>
        </div>
        <button class="ghost sm bar-stage" id="barStage" title="播放页"><svg class="ic up"><use href="#i-chev"/></svg></button>
      </div>
    </div>
  </div>

  <div class="pop volpop" id="volPop" hidden>
    <div class="vp-row">
      <svg class="ic"><use href="#i-vol"/></svg>
      <input type="range" id="vol2" min="0" max="100" step="1" value="50" aria-label="音量">
      <span class="volnum" id="volNum2">50</span>
    </div>
  </div>

  <!-- 设备选择浮层 -->
  <div class="pop" id="devPop" hidden></div>
  <!-- 行内菜单 -->
  <div class="pop" id="rowPop" hidden></div>

  <!-- 通用对话框 -->
  <dialog class="dlg" id="dlg">
    <form method="dialog">
      <h2 id="dlgTitle">新建歌单</h2>
      <div id="dlgBody"></div>
      <div class="dlg-foot">
        <button value="cancel" class="btn-ghost">取消</button>
        <button value="ok" class="btn-main" id="dlgOk">确定</button>
      </div>
    </form>
  </dialog>

  <audio id="audio" preload="auto"></audio>

  <!-- 移动端全屏歌词 -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-hd">
      <div class="sheet-info">
        <div class="sheet-t" id="sheetTitle">未在播放</div>
        <div class="sheet-a" id="sheetMeta">—</div>
      </div>
      <button class="ghost sm" id="sheetClose" aria-label="收起">
        <svg class="ic"><use href="#i-chev"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-track"><i id="sheetProg"></i></div>
  </div>
  <!-- 全屏播放页 -->
  <div class="stage" id="stage" hidden>
    <div class="stage-bg" id="stageBg" aria-hidden="true"></div>
    <div class="stage-veil" aria-hidden="true"></div>

    <div class="stage-in">
      <header class="stage-top">
        <button class="stage-back" id="stageBack" aria-label="收起">
          <svg class="ic"><use href="#i-chev"/></svg>
        </button>
        <div class="stage-seg" id="stageSeg">
          <button type="button" class="on" data-stpane="lyric">歌词</button>
          <button type="button" data-stpane="queue">队列</button>
        </div>
        <div class="stage-dev" id="stageDev">—</div>
      </header>

      <div class="stage-body">
        <div class="stage-l">
          <div class="stage-art" id="stageArt"></div>
        </div>

        <div class="stage-r">
          <div class="stage-head">
            <div class="stage-name" id="stageTitle">未在播放</div>
            <div class="stage-by" id="stageMeta">选择一首歌开始</div>
          </div>
          <div class="stage-lyric" id="stageLyric"></div>
          <div class="stage-queue" id="stageQueue" hidden></div>
        </div>
      </div>

      <div class="stage-bar">
        <div class="track stage-track" id="stTrack"><i></i><b></b></div>
        <div class="stage-bar-row">
          <div class="sb-side">
            <button class="sbtn" id="stFav" title="收藏"><svg class="ic"><use href="#i-heart"/></svg></button>
            <button class="sbtn" id="stMode" title="顺序播放"><svg class="ic"><use href="#i-seq"/></svg></button>
          </div>
          <div class="sb-mid">
            <button class="sbtn lg" id="stPrev" title="上一首"><svg class="ic lg"><use href="#i-prev"/></svg></button>
            <button class="sbtn play" id="stPlay" title="播放/暂停"><svg class="ic"><use href="#i-play"/></svg></button>
            <button class="sbtn lg" id="stNext" title="下一首"><svg class="ic lg"><use href="#i-next"/></svg></button>
          </div>
          <div class="sb-side end">
            <span class="stage-time"><b id="stCur">0:00</b><i>/</i><span id="stDur">0:00</span></span>
            <div class="stage-vol">
              <svg class="ic"><use href="#i-vol"/></svg>
              <input type="range" id="stVol" min="0" max="100" step="1" value="50" aria-label="音量">
              <span class="volnum" id="stVolNum">50</span>
            </div>
            <button class="sbtn" id="stCollapse" title="收起"><svg class="ic"><use href="#i-chev"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./app.js"></script>
</body>

</html>
